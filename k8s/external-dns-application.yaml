apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-dns
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://kubernetes-sigs.github.io/external-dns/
    chart: external-dns
    targetRevision: 1.22.0

    helm:
      values: |
        domainFilters:
          - abdimajidcloud.com

        policy: sync

        provider:
          name: aws

        registry: txt

        serviceAccount:
          create: false
          name: external-dns

        txtOwnerId: eks-project

  destination:
    server: https://kubernetes.default.svc
    namespace: external-dns

  syncPolicy:
    automated:
      prune: true
      selfHeal: true

    syncOptions:
      - CreateNamespace=true
