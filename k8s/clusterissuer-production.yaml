apiVersion: cert-manager.io/v1
kind: ClusterIssuer

metadata:
  name: letsencrypt-production

spec:
  acme:
    # Let’s Encrypt production ACME server
    server: https://acme-v02.api.letsencrypt.org/directory

    # Email used for the Let’s Encrypt ACME account
    email: abdimajid819@gmail.com

    # Secret used to store the production ACME account private key
    privateKeySecretRef:
      name: letsencrypt-production-account-key

    # Prove domain ownership using HTTP through NGINX Ingress
    solvers:
      - http01:
          ingress:
            class: nginx